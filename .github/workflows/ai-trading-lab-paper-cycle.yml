name: AI Trading Lab — Ray Paper Cycle (Stocks)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 9-15 * * 1-5"
      timezone: "America/New_York"
    - cron: "0 16 * * 1-5"
      timezone: "America/New_York"

jobs:
  paper-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run authenticated Ray strategy paper cycle for ETFs
        env:
          PAPER_CYCLE_URL: https://ai-trading-lab-2026.floot.app/_api/ray_cycle_cron
          REPORT_JOB_TOKEN: ${{ secrets.REPORT_JOB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${REPORT_JOB_TOKEN}" ]; then
            echo "Missing GitHub repository secret REPORT_JOB_TOKEN."
            exit 1
          fi
          echo "Calling authenticated Ray strategy paper cycle for SPY, QQQ, GLD, USO..."
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${REPORT_JOB_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"symbols":["SPY","QQQ","GLD","USO"]}' \
            "${PAPER_CYCLE_URL}")"
          echo "${response}"
          echo "${response}" | grep -q '"ok":true'
          echo "Authenticated Ray ETF paper cycle completed."
