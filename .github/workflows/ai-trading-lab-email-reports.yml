name: AI Trading Lab — Email Paper Reports

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Run at both possible UTC hours for 8 AM/8 PM
    # America/New_York across daylight-saving transitions, then filter below.
    - cron: "0 0,1,12,13 * * *"

jobs:
  email-paper-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send broker-confirmed paper-trading report
        env:
          REPORT_URL: https://ai-trading-lab-2026.floot.app/_api/ray_report
          REPORT_JOB_TOKEN: ${{ secrets.REPORT_JOB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            eastern_hour="$(TZ=America/New_York date +%H)"
            if [ "$eastern_hour" != "08" ] && [ "$eastern_hour" != "20" ]; then
              echo "Scheduled UTC slot does not match 8 AM/8 PM Eastern; skipping."
              exit 0
            fi
          fi
          if [ -z "${REPORT_JOB_TOKEN}" ]; then
            echo "Missing GitHub repository secret REPORT_JOB_TOKEN."
            exit 1
          fi
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${REPORT_JOB_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "${REPORT_URL}")"
          echo "$response"
          echo "$response" | grep -q '"ok":true'
          echo "Paper report email accepted by AgentMail."
