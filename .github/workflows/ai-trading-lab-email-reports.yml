name: AI Trading Lab — Email Paper Reports

on:
  # Automatic report schedule paused at the user's request.
  # Manual workflow_dispatch remains available if a report is wanted later.
  workflow_dispatch:

jobs:
  email-paper-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send broker-confirmed paper-trading report
        env:
          REPORT_URL: https://ai-trading-lab-2026.floot.app/_api/ray_report
          REPORT_JOB_TOKEN: ${{ secrets.REPORT_JOB_TOKEN }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            utc_hour="$(printf '%s' "${SCHEDULE_CRON}" | awk '{print $2}')"
            if ! [[ "${utc_hour}" =~ ^[0-9]{1,2}$ ]]; then
              echo "Could not identify scheduled UTC hour; refusing to send."
              exit 1
            fi
            # Use the scheduled UTC slot, not the runner's current hour.
            # GitHub may start scheduled workflows late; this avoids silently
            # dropping a report just because the runner started after 8 AM/PM ET.
            utc_date="$(date -u +%F)"
            scheduled_epoch="$(date -u -d "${utc_date} ${utc_hour}:00" +%s)"
            eastern_hour="$(TZ=America/New_York date -d "@${scheduled_epoch}" +%H)"
            if [ "${eastern_hour}" != "08" ] && [ "${eastern_hour}" != "20" ]; then
              echo "This UTC slot is not the 8 AM/8 PM Eastern slot today; skipping."
              exit 0
            fi
          fi
          if [ -z "${REPORT_JOB_TOKEN}" ]; then
            echo "Missing GitHub repository secret REPORT_JOB_TOKEN."
            exit 1
          fi
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${REPORT_JOB_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "${REPORT_URL}")"
          echo "${response}"
          echo "${response}" | grep -q '"ok":true'
          echo "Paper report email accepted by AgentMail."
