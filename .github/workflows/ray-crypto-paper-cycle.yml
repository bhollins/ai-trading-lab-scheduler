name: AI Trading Lab — Ray Paper Cycle (Bitcoin)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
      timezone: "America/New_York"

jobs:
  paper-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run Ray Bitcoin paper cycle
        env:
          PAPER_CYCLE_URL: https://ai-trading-lab-2026.floot.app/_api/ray_paper_cycle
        run: |
          set -euo pipefail
          echo "Calling Ray strategy paper cycle for BTC/USD..."
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"symbols":["BTC/USD"]}' \
            "$PAPER_CYCLE_URL")"
          echo "$response"
          echo "$response" | grep -q '"ok":true'
          echo "Ray Bitcoin paper cycle endpoint responded successfully."
